<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Happy Homes — Orders</title>
<style>
:root{
  --navy:#0a2540; --navy-soft:#20456b; --green:#1e5631; --green-soft:#2f7a46;
  --bg:#ffffff; --panel:#f7f8fa; --line:#e3e7ee; --line-strong:#c9d2de;
  --muted:#5d6b7e;
  --amber:#9a6207; --amber-bg:#fdf4e3; --amber-line:#f0e0c0;
  --red:#9b2c2c; --red-bg:#fceeee; --red-line:#f0d4d4;
  --green-bg:#eaf4ed; --green-line:#cfe3d6;
  --blue:#1d4e89; --blue-bg:#eaf1fa; --blue-line:#cfdff2;
  --shadow:0 1px 2px rgba(10,37,64,.06), 0 8px 24px rgba(10,37,64,.07);
  --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--navy);
  font:15px/1.5 "Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}

/* Same height-locked shell as the dealer portal, so the Assembly embed
   auto-sizes to a stable 720px instead of collapsing or running away. */
#app{position:relative;display:flex;flex-direction:column;height:100dvh;min-height:720px;overflow:hidden}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden}

.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:7px 20px;font-size:12.5px}
.topbar b{font-weight:600}
.crosslink{
  display:inline-flex;align-items:center;gap:6px;
  color:#cfe0f2;text-decoration:none;font-weight:600;white-space:nowrap;
  border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px 12px;
}
.crosslink:hover{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}

header.masthead{border-bottom:1px solid var(--line);padding:16px 20px 0;background:var(--bg)}
.mast-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
h1 small{display:block;font-size:11px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--green-soft);margin-top:3px}
.spacer{flex:1}

.search{display:flex;align-items:center;border:1px solid var(--line-strong);
  border-radius:999px;padding:6px 12px;gap:8px;min-width:210px;background:#fff}
.search input{border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent;color:var(--navy)}
.search svg{flex:none;opacity:.55}

.iconbtn{background:#fff;border:1px solid var(--line-strong);border-radius:8px;
  padding:8px 13px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;
  align-items:center;gap:7px}
.iconbtn:hover{border-color:var(--navy)}
.iconbtn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn svg{flex:none}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tiles{display:flex;gap:10px;flex-wrap:wrap;padding:16px 0 0}
.tile{border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;
  min-width:118px;background:#fff}
.tile .n{font-size:21px;font-weight:700;line-height:1.15}
.tile .l{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin-top:2px}
.tile.new{background:var(--amber-bg);border-color:var(--amber-line)}
.tile.new .n{color:var(--amber)}
.tile.value{background:var(--green-bg);border-color:var(--green-line)}
.tile.value .n{color:var(--green)}

.filters{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0 12px}
.chip{border:1px solid var(--line-strong);background:#fff;border-radius:999px;
  padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--navy);color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

main{padding:6px 20px 60px;max-width:1200px;margin:0 auto;width:100%}

.order{border:1px solid var(--line);border-radius:var(--radius);margin:12px 0;background:#fff;
  transition:box-shadow .15s,border-color .15s}
.order:hover{box-shadow:var(--shadow)}
.order.open{border-color:var(--line-strong);box-shadow:var(--shadow)}
.order-head{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.order-head .ref{font-size:14px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.order-head .when{font-size:12px;color:var(--muted);white-space:nowrap}
.order-head .dealer{font-size:13px;color:var(--navy);flex:1;min-width:130px}
.order-head .lines{font-size:12px;color:var(--muted);white-space:nowrap}
.order-head .amount{font-size:15px;font-weight:700;white-space:nowrap}
.caret{transition:transform .18s;flex:none;opacity:.5}
.order.open .caret{transform:rotate(90deg)}

.pill{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.pill.New{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.pill.Confirmed{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-line)}
.pill.Shipped{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.pill.Cancelled{background:#eef1f5;color:var(--muted);border-color:var(--line-strong)}

.order-body{display:none;border-top:1px solid var(--line);padding:14px 16px 16px}
.order.open .order-body{display:block}

table.lines{width:100%;border-collapse:collapse;font-size:13px}
table.lines th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--line);padding:0 10px 8px 0;font-weight:700}
table.lines td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.lines td.num,table.lines th.num{text-align:right;padding-right:0;white-space:nowrap}
table.lines tfoot td{font-weight:700;border-bottom:0;padding-top:12px;font-size:14px}
.sku{font-weight:700;color:var(--green-soft);font-size:12px}

.notes{margin:14px 0 0;font-size:12.5px;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;
  padding-top:14px;border-top:1px solid var(--line)}
.actions .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.act{border:1px solid var(--line-strong);background:#fff;border-radius:7px;padding:8px 14px;
  font-size:12.5px;font-weight:600;cursor:pointer}
.act:hover:not(:disabled){border-color:var(--navy)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act.current{background:var(--navy);border-color:var(--navy);color:#fff}
.act.danger:hover:not(:disabled){border-color:var(--red);color:var(--red)}

.state{padding:64px 20px;text-align:center;color:var(--muted)}
.state h3{color:var(--navy);margin:0 0 8px;font-size:17px}
.state .iconbtn{margin-top:14px}
.err{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red);
  border-radius:8px;padding:11px 13px;font-size:12.5px;margin:14px 0}

.toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;
  font-weight:600;z-index:70;box-shadow:var(--shadow);opacity:0;visibility:hidden;
  transition:opacity .2s,transform .2s,visibility .2s}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

footer.foot{border-top:1px solid var(--line);padding:20px;text-align:center;
  font-size:11.5px;color:var(--muted)}

@media (max-width:760px){
  .topbar > div:nth-of-type(1){display:none}   /* keep the bar one line */
  main{padding-left:14px;padding-right:14px}
  header.masthead{padding-left:14px;padding-right:14px}
  .order-head{gap:9px}
  .order-head .when,.order-head .lines{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a class="crosslink" href="/index.html" id="toHome">&larr; Dealer Home</a>
    <div>Happy Homes Industries &nbsp;&middot;&nbsp; Dealer Hub</div>
    <div>Order desk</div>
  </div>

  <header class="masthead">
    <div class="mast-row">
      <h1>Orders<small>Submitted by dealers</small></h1>
      <div class="spacer"></div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        <input id="q" type="search" placeholder="Reference, dealer, SKU&hellip;" aria-label="Search orders">
      </div>
      <button class="iconbtn" id="refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
        Refresh
      </button>
    </div>

    <div class="tiles" id="tiles"></div>
    <div class="filters" id="filters"></div>
  </header>

  <div id="scroll">
    <main>
      <div id="list"></div>
      <div id="state" class="state" hidden></div>
    </main>
    <footer class="foot">
      Orders are recorded in the <b>happy homes orders</b> sheet. Status changes here write straight back to it.
    </footer>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  "use strict";

  var CONFIG = {
    ordersUrl: "/api/orders",
    statusUrl: "/api/order-status",
    pollSeconds: 30          // so a submission in Dealer Home shows up here on its own
  };

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function money(n) {
    if (n == null || isNaN(n)) return null;
    return "$" + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  var ORDERS = [];
  var STATUSES = ["New", "Confirmed", "Shipped", "Cancelled"];
  var filter = "All";
  var openRefs = {};        // preserved across refreshes so a poll cannot collapse a row
  var busy = false;         // a status write is in flight; hold polling off

  /* ---------------------------------------------------------------- */

  function visible() {
    var q = $("#q").value.trim().toLowerCase();
    return ORDERS.filter(function (o) {
      if (filter !== "All" && o.status !== filter) return false;
      if (!q) return true;
      var hay = o.reference + " " + o.dealer + " " + o.contact + " " + o.notes + " " +
        o.items.map(function (i) { return i.sku + " " + i.name; }).join(" ");
      return hay.toLowerCase().indexOf(q) !== -1;
    });
  }

  function renderTiles() {
    var counts = { New: 0, Confirmed: 0, Shipped: 0, Cancelled: 0 };
    var openValue = 0;
    ORDERS.forEach(function (o) {
      if (counts[o.status] == null) counts[o.status] = 0;
      counts[o.status] += 1;
      if (o.status === "New" || o.status === "Confirmed") openValue += (o.total || 0);
    });

    $("#tiles").innerHTML =
      '<div class="tile new"><div class="n">' + counts.New + '</div><div class="l">Needs action</div></div>' +
      '<div class="tile"><div class="n">' + counts.Confirmed + '</div><div class="l">Confirmed</div></div>' +
      '<div class="tile"><div class="n">' + counts.Shipped + '</div><div class="l">Shipped</div></div>' +
      '<div class="tile value"><div class="n">' + (money(openValue) || "$0.00") +
        '</div><div class="l">Open value</div></div>';

    $("#filters").innerHTML = ["All"].concat(STATUSES).map(function (s) {
      var n = s === "All" ? ORDERS.length : (counts[s] || 0);
      return '<button class="chip" data-filter="' + esc(s) + '" aria-pressed="' +
        (filter === s) + '">' + esc(s) + " (" + n + ")</button>";
    }).join("");
  }

  function orderHtml(o) {
    var isOpen = !!openRefs[o.reference];
    return '' +
      '<article class="order' + (isOpen ? " open" : "") + '" data-ref="' + esc(o.reference) + '">' +
        '<div class="order-head" data-toggle="' + esc(o.reference) + '">' +
          '<svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" ' +
            'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M9 18l6-6-6-6"/></svg>' +
          '<span class="ref">' + esc(o.reference) + "</span>" +
          '<span class="pill ' + esc(o.status) + '">' + esc(o.status) + "</span>" +
          '<span class="dealer">' + esc(o.dealer || "&mdash;") + "</span>" +
          '<span class="when">' + esc(o.submittedAt) + "</span>" +
          '<span class="lines">' + o.lines + (o.lines === 1 ? " line" : " lines") + "</span>" +
          '<span class="amount">' + (money(o.total) || "&mdash;") + "</span>" +
        "</div>" +
        '<div class="order-body">' +
          '<table class="lines"><thead><tr>' +
            "<th>SKU</th><th>Product</th><th>Category</th>" +
            '<th class="num">Qty</th><th class="num">Dealer price</th><th class="num">Line total</th>' +
          "</tr></thead><tbody>" +
          o.items.map(function (i) {
            return "<tr>" +
              '<td class="sku">' + esc(i.sku) + "</td>" +
              "<td>" + esc(i.name) + "</td>" +
              '<td style="color:var(--muted)">' + esc(i.category || "&mdash;") + "</td>" +
              '<td class="num">' + i.qty + "</td>" +
              '<td class="num">' + (money(i.price) || "&mdash;") + "</td>" +
              '<td class="num">' + (money(i.lineTotal) || "&mdash;") + "</td>" +
            "</tr>";
          }).join("") +
          "</tbody><tfoot><tr>" +
            '<td colspan="5">Order total</td>' +
            '<td class="num">' + (money(o.total) || "&mdash;") + "</td>" +
          "</tr></tfoot></table>" +
          (o.notes ? '<p class="notes"><b>Dealer note:</b> ' + esc(o.notes) + "</p>" : "") +
          '<div class="actions"><span class="lbl">Move to</span>' +
            STATUSES.map(function (s) {
              var current = s === o.status;
              return '<button class="act' + (current ? " current" : "") +
                (s === "Cancelled" ? " danger" : "") + '"' +
                ' data-set="' + esc(o.reference) + '" data-status="' + esc(s) + '"' +
                (current ? " disabled" : "") + ">" + esc(s) + "</button>";
            }).join("") +
          "</div>" +
        "</div>" +
      "</article>";
  }

  function render() {
    renderTiles();
    var rows = visible();
    var host = $("#list");

    if (!ORDERS.length) {
      host.innerHTML = "";
      showState("<h3>No orders yet</h3><p>Submitted orders from the dealer portal appear here " +
        "within " + CONFIG.pollSeconds + " seconds.</p>");
      return;
    }
    if (!rows.length) {
      host.innerHTML = '<div class="state"><h3>Nothing matches</h3><p>No orders match the ' +
        "current filter or search.</p></div>";
      $("#state").hidden = true;
      return;
    }
    $("#state").hidden = true;
    host.innerHTML = rows.map(orderHtml).join("");
  }

  function showState(html) {
    $("#state").hidden = false;
    $("#state").innerHTML = html;
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  /* ---------------------------------------------------------------- */

  function load(showSpinner) {
    var btn = $("#refresh");
    if (showSpinner) { btn.disabled = true; btn.querySelector("svg").classList.add("spin"); }

    return fetch(CONFIG.ordersUrl, { cache: "no-store" })
      .then(function (r) {
        return r.json().then(function (b) { return { ok: r.ok, body: b }; });
      })
      .then(function (res) {
        if (!res.ok) throw new Error(res.body && res.body.error ? res.body.error : "Could not load orders");
        ORDERS = (res.body && res.body.orders) || [];
        if (res.body && res.body.statuses && res.body.statuses.length) STATUSES = res.body.statuses;
        render();
      })
      .catch(function (err) {
        $("#list").innerHTML = "";
        showState("<h3>Could not load orders</h3><p>" + esc(err.message) + "</p>" +
          '<button class="iconbtn" onclick="location.reload()">Try again</button>');
      })
      .then(function () {
        btn.disabled = false;
        btn.querySelector("svg").classList.remove("spin");
      });
  }

  function setStatus(reference, status, button) {
    busy = true;
    var group = button.parentNode;
    $$("button", group).forEach(function (b) { b.disabled = true; });
    button.textContent = "Saving…";

    fetch(CONFIG.statusUrl, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ reference: reference, status: status })
    })
      .then(function (r) {
        return r.json().then(function (b) { return { ok: r.ok, body: b }; });
      })
      .then(function (res) {
        if (!res.ok || !res.body.ok) {
          throw new Error(res.body && res.body.error ? res.body.error : "Status update failed");
        }
        // Update in place so the open row does not jump or collapse.
        ORDERS.forEach(function (o) { if (o.reference === reference) o.status = status; });
        render();
        toast(reference + " → " + status);
      })
      .catch(function (err) {
        button.textContent = status;
        $$("button", group).forEach(function (b) { b.disabled = false; });
        var body = group.parentNode;
        var existing = $(".err", body);
        if (existing) existing.remove();
        var div = document.createElement("div");
        div.className = "err";
        div.innerHTML = "<b>Could not update.</b> " + esc(err.message) +
          "<br>The order is unchanged &mdash; try again.";
        body.insertBefore(div, group);
      })
      .then(function () { busy = false; });
  }

  /* ---------------------------------------------------------------- */

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-toggle],[data-set],[data-filter]");
    if (!t) return;

    if (t.hasAttribute("data-filter")) {
      filter = t.getAttribute("data-filter");
      render();
      return;
    }
    if (t.hasAttribute("data-toggle")) {
      var ref = t.getAttribute("data-toggle");
      openRefs[ref] = !openRefs[ref];
      t.parentNode.classList.toggle("open", !!openRefs[ref]);
      return;
    }
    if (t.hasAttribute("data-set")) {
      setStatus(t.getAttribute("data-set"), t.getAttribute("data-status"), t);
    }
  });

  var debounce = null;
  $("#q").addEventListener("input", function () {
    clearTimeout(debounce);
    debounce = setTimeout(render, 160);
  });
  $("#refresh").addEventListener("click", function () { load(true); });

  load(true);
  setInterval(function () {
    if (!busy && !document.hidden) load(false);
  }, CONFIG.pollSeconds * 1000);

  // Height hint for an auto-sizing embed host.
  function reportHeight() {
    try {
      if (window.parent === window) return;
      window.parent.postMessage({ type: "resize",
        height: Math.max(document.documentElement.scrollHeight, 720) }, "*");
    } catch (e) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
})();
</script>
</body>
</html>
