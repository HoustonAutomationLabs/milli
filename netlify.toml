# Netlify configuration — DEMO deployment.
#
# This site shows the dashboard to stakeholders using the agency's real
# operational figures on DE-IDENTIFIED data: real row counts, dates, statuses,
# task types and distributions, with every name, identifier, address and phone
# replaced and birth dates shifted. See data/demo/DEIDENTIFIED.txt.
#
# It is NOT a production deployment and must never be pointed at real records:
#   - Authentication is stubbed (src/lib/auth.ts) — the login page hands out a
#     session for any role on request. There is no real identity provider, and
#     this site is reachable by anyone with the URL.
#   - Netlify does not sign a BAA on standard plans, so PHI must not be
#     processed or stored here. See the compliance section of README.md.
#
# ER_EXPORT_DIR is pinned to data/demo below. Never point it at data/exports,
# which is where real downloads live.

[build]
  command = "npm run build"
  publish = ".next"

# NOTE: [build.environment] applies at BUILD time only.
#
# The Next.js server runs as a Netlify Function and reads process.env per
# request, where these values are NOT present. Setting them here alone made
# the deployed demo fall back to synthetic data for two days while appearing
# correctly configured — 42 mock cases where the de-identified set has 52.
#
# The values below are kept because the build itself reads them, but the ones
# that actually decide what the site serves are the SITE environment
# variables, set under Site configuration -> Environment variables:
#
#   DATA_SOURCE   = exports
#   ER_EXPORT_DIR = ./data/demo
#
# If those are ever removed the site does not break: it degrades to synthetic
# data and the in-app banner says so. See src/lib/zoho/client.ts.
[build.environment]
  NODE_VERSION = "22"
  # De-identified data only. Never point this at data/exports.
  DATA_SOURCE = "exports"
  ER_EXPORT_DIR = "./data/demo"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The workbooks under data/demo are read at request time from a path given by
# ER_EXPORT_DIR, so Next's file tracing cannot see the dependency and would
# leave them out of the function bundle. next.config.mjs pulls them in via
# outputFileTracingIncludes. Without it the site builds cleanly and then
# serves synthetic data on every request.

# Defence in depth: next.config.mjs already sets these, but a misconfigured
# build should not silently drop them.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Demo data only, but keep crawlers off it regardless.
    X-Robots-Tag = "noindex, nofollow"
